plugins {
    id 'java'
    id 'application'
}

group = 'org.apache.ossie.tutorial'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson for YAML and JSON parsing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // Apache Commons Lang
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // Embedded in-memory SQL database for executing compiled semantic queries
    implementation 'com.h2database:h2:2.2.224'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.apache.ossie.tutorial.app.OssieTutorialApp'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// -------------------------------------------------------------
// Step-by-Step Hands-On Tasks
// -------------------------------------------------------------
def steps = [
    [name: 'step1', class: 'Step1_CoreConceptsAndModelLoading', desc: 'Step 1: Core Concepts & Model Loading'],
    [name: 'step2', class: 'Step2_SemanticValidation', desc: 'Step 2: Semantic Integrity Validation'],
    [name: 'step3', class: 'Step3_Layer1_ExpressionsAndDialects', desc: 'Step 3: Layer 1 - Expressions & Dialects'],
    [name: 'step4', class: 'Step4_Layer2_RelationalGraphAndJoins', desc: 'Step 4: Layer 2 - Relational Graph & Multi-Hop Joins'],
    [name: 'step5', class: 'Step5_Layer3_WideTableQueryCompilation', desc: 'Step 5: Layer 3 - Wide-Table Query Compilation'],
    [name: 'step6', class: 'Step6_ExecutingSemanticQueriesOnDatabase', desc: 'Step 6: Executing Queries on Real Database'],
    [name: 'step7', class: 'Step7_AiGroundingAndMcpTools', desc: 'Step 7: AI Grounding & MCP Tools'],
    [name: 'step8', class: 'Step8_CrossPlatformInterchange', desc: 'Step 8: Cross-Platform Interchange (dbt & Snowflake)']
]

steps.each { stepInfo ->
    tasks.register(stepInfo.name, JavaExec) {
        group = 'ossie-tutorial'
        description = stepInfo.desc
        classpath = sourceSets.main.runtimeClasspath
        mainClass = "org.apache.ossie.tutorial.steps.${stepInfo.class}"
        standardInput = System.in
    }
}
